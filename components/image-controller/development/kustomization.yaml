apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
#- https://github.com/konflux-ci/image-controller/config/default?ref=a7573b4fd18e7d695f36d2650f5766afedd13769
- https://github.com/rcerven/image-controller/config/default?ref=170082bbddf9eb6bc7d0725e4b6502df64e53ca3

images:
- name: quay.io/konflux-ci/image-controller
#  newName: quay.io/konflux-ci/image-controller
#  newTag: 8cc0300af9588b9c5450c7f3acdc55c34798a83d
  newName: quay.io/rcerven_rhtaptest/image-operator
  newTag: latest

namespace: image-controller

patches:
  - path: ./manager_resources_patch.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: controller-manager
    path: logs-in-console-format-cmd-arg-patch.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: controller-manager
    path: sealights-token-patch.yaml
