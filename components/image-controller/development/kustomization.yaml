apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
- https://github.com/konflux-ci/image-controller/config/default?ref=4556177363384eb380e1b174d191868263502260
#- https://github.com/rcerven/image-controller/config/default?ref=87a2f372b1b1d4d1c82d6f8fea78a65a503d0ab7

images:
- name: quay.io/konflux-ci/image-controller
#  newName: quay.io/konflux-ci/image-controller
#  newTag: 58b6c424ef356914a960ad29405c51e6b4b1d4f2
  newName: quay.io/rcerven_rhtaptest/image-operator
  newTag: latest

namespace: image-controller

patches:
  - path: ./manager_resources_patch.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: controller-manager
    path: logs-in-console-format-cmd-arg-patch.yaml
