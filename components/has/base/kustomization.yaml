apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./argocd-roles
  - ./rbac
  - https://github.com/redhat-appstudio/application-service/config/default?ref=1336ddc41f94df2da57a8ad8da2613e789be4041
#  - https://github.com/rcerven/application-service/config/default?ref=88efdf8c11f067fd84d0144220c7abbdb921a13d


components:
  - ../k-components/manager-resources
  - ../k-components/enable-profiling

images:
  - name: quay.io/redhat-appstudio/application-service
    newName: quay.io/redhat-appstudio/application-service
    newTag: 1336ddc41f94df2da57a8ad8da2613e789be4041
#    newName: quay.io/rcerven_rhtaptest/application-operator
#    newTag: latest

configMapGenerator:
  - literals:
      - GITHUB_ORG=""
    name: github-config
    behavior: replace
  - literals:
      - ENVIRONMENT="development"
    name: feature-flag-config
    behavior: replace


namespace: application-service
