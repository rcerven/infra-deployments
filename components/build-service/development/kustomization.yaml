apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
#- https://github.com/konflux-ci/build-service/config/default?ref=0e5828d8aff1f13b06518a44b4c7a3d853a08af6
- https://github.com/rcerven/build-service/config/default?ref=7b4679beae595ea8299e89313b30ac5e23d68de5

namespace: build-service

images:
- name: quay.io/konflux-ci/build-service
#  newName: quay.io/konflux-ci/build-service
#  newTag: 8cacf40e00bad8d13635e5e7429239e32a71c9ad
  newName: quay.io/rcerven_rhtaptest/build-operator
  newTag: latest

commonAnnotations:
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: controller-manager
    path: logs-in-console-format-cmd-arg-patch.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: build-service-controller-manager
    path: image-expiration-patch.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: build-service-controller-manager
    path: pac-webhook-insecure-ssl-patch.yaml
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: build-service-controller-manager
    path: sealights-token-patch.yaml
components:
  - ../components/rh-certs
